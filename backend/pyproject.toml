[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-api"
version = "0.1.0"
description = "Backend for a self-service DevOps platform: per-environment tools behind scopes and a two-person approval rule"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.156.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "boto3==1.43.116",
    "fastmcp==4.1.3",
    "pydantic-ai-slim[ag-ui,anthropic,bedrock]==2.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.15.1",
    "moto[dynamodb]==5.2.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["platform_api"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=platform_api --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
